name: vocabforge

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocabforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocabforge}
      POSTGRES_DB: ${POSTGRES_DB:-vocabforge}
    ports:
      # Mở ra host để tiện dùng psql/DBeaver; đổi VF_DB_PORT nếu 5432 đã bận.
      - "${VF_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Backend chỉ khởi động sau khi Postgres thật sự nhận được kết nối.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocabforge} -d ${POSTGRES_DB:-vocabforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: ${VF_BUILD_TARGET:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vocabforge}:${POSTGRES_PASSWORD:-vocabforge}@db:5432/${POSTGRES_DB:-vocabforge}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      DEBUG: ${DEBUG:-true}

      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "${VF_API_PORT:-8000}:8000"
    volumes:
      # Mount code để --reload hoạt động ở chế độ dev. Ở prod (VF_BUILD_TARGET=base)
      # bỏ dòng này đi thì container chạy hoàn toàn bằng code đã build vào image.
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      # Spec dùng làm nguồn chuẩn cho test đối chiếu system prompt (test_agents.py).
      - ./docs:/docs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys,json; d=json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if d['status']=='ok' else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: ${VF_FE_BUILD_TARGET:-dev}
      args:
        # VITE_* nhúng vào bundle lúc build (chỉ dùng cho target prod).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      # Trình duyệt gọi API qua host, không qua tên service trong mạng compose.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${VF_WEB_PORT:-5173}:5173"
    volumes:
      # Mount source cho HMR ở chế độ dev. Ở prod (VF_FE_BUILD_TARGET=prod) nginx phục
      # vụ bundle đã build sẵn trong image, các dòng này thành thừa nhưng vô hại.
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/components.json:/app/components.json
      # Volume ẩn danh giữ node_modules của container, không để thư mục host đè lên.
      - /app/node_modules

volumes:
  pgdata:
